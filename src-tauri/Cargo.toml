[package]
name = "localboard"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Второй запуск обязан поднимать уже открытое окно, а не вторую копию: две
# копии над одной папкой досок молча затирали бы правки друг друга.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
