name: LocalBoard CI

on:
  # Только основная ветка: на ветках ботов и предложений тот же прогон
  # уже идёт по pull_request, а по push у него нет ни прав, ни смысла —
  # 15 августа такой двойник упал на ветке Dependabot, хотя проверка
  # предложения была зелёной.
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          components: clippy,rustfmt
      - run: npm install --global yarn@1.22.22
      - name: Prepare pinned editor
        run: zsh scripts/setup.sh
      - run: npx prettier --check src package.json tsconfig.json vite.config.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run audit:runtime
      - name: Release app
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload verified app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LocalBoard-${{ github.sha }}
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7
